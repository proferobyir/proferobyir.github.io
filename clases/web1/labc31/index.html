<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Nav y Containers</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- 1. Menú con container-fluid para que vaya de borde a borde -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Práctica Obligatoria</a>
            <ul class="nav">
                <li class="nav-item"><a class="nav-link text-white" href="#">Inicio</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Perfil</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Salir</a></li>
            </ul>
        </div>
    </nav>

    <!-- 2. Sección superior con container-fluid (ancho completo) -->
    <div class="container-fluid bg-primary text-white p-5 mb-4 text-center">
        <h1>Header Fluid (De borde a borde)</h1>
        <p>Este bloque ocupa el 100% de la pantalla.</p>
    </div>

    <!-- 3. Sección principal con container (centrado y con márgenes) -->
    <div class="container bg-white p-4 shadow-sm rounded">
        <h2>Contenido Principal (.container)</h2>
        <p>Noten cómo este texto tiene márgenes laterales automáticos y no pega contra los bordes de la pantalla del monitor.</p>
        <button class="btn btn-success" onclick="alert('¡Práctica aprobada!')">Validar Ejercicio</button>
    </div>

</body>
</html>
