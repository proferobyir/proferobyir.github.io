<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice del contenido de Programación II en C# | Visual Studio 2026</title>

    <style>
        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Paleta inspirada en .NET / Visual Studio */
            --bg-primary: #0e0e12;
            --bg-secondary: #16161d;
            --bg-card: #1c1c26;
            --bg-card-hover: #232330;
            --border-subtle: #2a2a3a;

            --accent-purple: #9b4f96;
            --accent-violet: #7b5cf0;
            --accent-cyan: #48dbfb;
            --accent-gradient: linear-gradient(135deg, #7b5cf0 0%, #9b4f96 50%, #48dbfb 100%);

            --text-primary: #f0f0f5;
            --text-secondary: #a8a8b8;
            --text-muted: #6c6c80;

            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;

            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.35);
            --shadow-glow: 0 0 40px rgba(123, 92, 240, 0.15);

            --font-sans: "Segoe UI", system-ui, -apple-system, "Inter", sans-serif;
            --font-mono: "Cascadia Code", "Fira Code", "Consolas", monospace;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(123, 92, 240, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 100%, rgba(72, 219, 251, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---------- Encabezado ---------- */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
            max-width: 720px;
            animation: fadeUp 0.6s ease both;
        }

        header h1 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Detalle tipo etiqueta de código */
        header p::before {
            content: "// ";
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* ---------- Navegación ---------- */
        nav {
            width: 100%;
            max-width: 900px;
        }

        nav ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
        }

        nav li {
            animation: fadeUp 0.6s ease both;
        }

        nav li:nth-child(1) {
            animation-delay: 0.1s;
        }

        nav li:nth-child(2) {
            animation-delay: 0.2s;
        }

        nav li:nth-child(3) {
            animation-delay: 0.3s;
        }

        nav li:nth-child(4) {
            animation-delay: 0.4s;
        }

        nav li:nth-child(5) {
            animation-delay: 0.5s;
        }

        nav li:nth-child(6) {
            animation-delay: 0.6s;
        }

        nav a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 1.25rem 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 1rem;
            overflow: hidden;
            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* Barra de acento animada */
        nav a::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        /* Icono tipo chevron */
        nav a::after {
            content: "›";
            margin-left: auto;
            font-size: 1.4rem;
            color: var(--text-muted);
            transition: color 0.25s ease, transform 0.25s ease;
        }

        nav a:hover,
        nav a:focus-visible {
            background: var(--bg-card-hover);
            border-color: rgba(123, 92, 240, 0.45);
            transform: translateY(-3px);
            box-shadow: var(--shadow-soft), var(--shadow-glow);
            outline: none;
        }

        nav a:hover::before,
        nav a:focus-visible::before {
            opacity: 1;
        }

        nav a:hover::after,
        nav a:focus-visible::after {
            color: var(--accent-violet);
            transform: translateX(3px);
        }

        /* Marcador/icono de semana */
        nav a .week-badge {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            background: rgba(123, 92, 240, 0.15);
            color: var(--accent-violet);
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(123, 92, 240, 0.3);
            flex-shrink: 0;
        }

        /* ---------- Animaciones ---------- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        /* ---------- Footer ---------- */
        footer {
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: var(--font-mono);
        }

        footer::before {
            content: "/* ";
        }

        footer::after {
            content: " */";
        }
    </style>
</head>

<body>

    <header>
        <h1>Programación II en C#</h1>
        <p>Índice del contenido · Visual Studio 2026</p>
    </header>

    <nav aria-label="Índice de semanas">
        <ul>
            <li>
                <a href="./semana1">
                    <span class="week-badge">01</span>
                    Primeros Pasos
                </a>
            </li>
            <!-- Agrega más semanas aquí siguiendo el mismo patrón -->
        </ul>
    </nav>

    <footer>Profesor: Ing. Robyir Loreto</footer>

</body>

</html>
