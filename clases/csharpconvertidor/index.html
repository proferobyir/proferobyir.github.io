<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptador C# - Laboratorio (VS2012 vs VS2026)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            padding: 20px;
            margin: 0;
        }

        h2 {
            color: #0066cc;
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666666;
            margin-top: 0;
            font-size: 14px;
        }

        .container {
            display: flex;
            gap: 20px;
            height: 68vh;
            margin-top: 20px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        textarea {
            flex: 1;
            background-color: #141414;
            color: #f8f8f2;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            outline: none;
        }

        textarea:focus {
            border-color: #10B981;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        select,
        button {
            background-color: #ffffff;
            color: #1a1a1a;
            border: 1px solid #cccccc;
            padding: 10px 16px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        button {
            background-color: #0066cc;
            color: #ffffff;
            border: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0052a3;
        }

        .info-box {
            max-width: 1000px;
            margin: 15px auto;
            padding: 12px 15px;
            background: #f4f4f5;
            border-left: 4px solid #0066cc;
            border-radius: 4px;
            font-size: 13px;
            color: #333333;
        }
    </style>
</head>

<body>

    <h2>Adaptador C# para Laboratorio</h2>
    <p class="subtitle">Compatibilidad entre VS 2012 (C# 5) y VS 2022 / 2026 (C# 10–13)</p>

    <div class="container">
        <div class="panel">
            <label for="inputCode">Código de Entrada:</label>
            <textarea id="inputCode" placeholder="Pega el código aquí..."></textarea>
        </div>

        <div class="panel">
            <label for="outputCode">Código Convertido:</label>
            <textarea id="outputCode" readonly placeholder="El resultado compatible aparecerá aquí..."></textarea>
        </div>
    </div>

    <div class="controls">
        <label for="modeSelect" style="color:#1a1a1a; margin:0;">Dirección:</label>
        <select id="modeSelect">
            <option value="toLegacy"> Moderno (2022/2026) ➔ Legacy (VS 2012)</option>
            <option value="toModern"> Legacy (VS 2012) ➔ Moderno (2022/2026)</option>
        </select>
        <button id="btnConvert">Convertir Código</button>
    </div>

    <div class="info-box">
        <strong>💡 Utilidad de laboratorio:</strong> Convierte la sintaxis rápida que usas en casa para que compile en
        el **.NET Framework 4.5 / C# 5** de las máquinas del laboratorio sin lanzar errores de sintaxis.
    </div>

    <script>
        class CSharpLabAdapter {

            // --- DE MODERNO A LEGACY (VS 2012) ---
            toLegacy(code) {
                if (!code) return '';
                let result = code;

                // 1. File-scoped namespace -> Bloque con { }
                if (/^namespace\s+([A-Za-z0-9_.]+);/m.test(result)) {
                    result = result.replace(/^namespace\s+([A-Za-z0-9_.]+);/m, 'namespace $1\n{');
                    result += '\n}';
                }

                // 2. Primary Constructors -> Clase con campos y constructor tradicional
                result = result.replace(/(public|private|internal)?\s*class\s+([A-Za-z0-9_]+)\s*\(([^)]+)\)/g, (match, vis, className, params) => {
                    const access = vis ? vis + ' ' : '';
                    const paramList = params.split(',').map(p => p.trim());
                    let fields = '';
                    let assignments = '';

                    paramList.forEach(p => {
                        const parts = p.split(/\s+/);
                        const type = parts[0];
                        const name = parts[parts.length - 1];
                        const propName = name.charAt(0).toUpperCase() + name.slice(1);

                        fields += `    public ${type} ${propName} { get; private set; }\n`;
                        assignments += `        this.${propName} = ${name};\n`;
                    });

                    return `${access}class ${className}\n{\n${fields}\n    public ${className}(${params})\n    {\n${assignments}    }`;
                });

                // 3. Collection expressions [] -> new List<string>()
                result = result.replace(/=\s*\[\];/g, '= new List<string>();');

                // 4. Interpolación $"..." -> string.Format(...)
                result = result.replace(/\$"([^"\r\n]*)"/g, (match, content) => {
                    let index = 0;
                    const vars = [];
                    const formattedString = content.replace(/\{([^{}]+)\}/g, (m, expr) => {
                        vars.push(expr.trim());
                        return `{${index++}}`;
                    });

                    return vars.length > 0
                        ? `string.Format("${formattedString}", ${vars.join(', ')})`
                        : `"${content}"`;
                });

                return result;
            }

            // --- DE LEGACY (VS 2012) A MODERNO ---
            toModern(code) {
                if (!code) return '';
                let result = code;

                // 1. Instanciaciones tradicionales -> []
                result = result.replace(/new\s+(?:List<[^>]+>|ArrayList|HashSet<[^>]+>)\s*\(\s*\)(?:\s*\/\/[^\r\n]*)?/g, '[]');
                result = result.replace(/(?:Array|Enumerable)\.Empty<[^>]+>\(\)/g, '[]');

                // 2. string.Format(...) -> Interpolación $"..."
                result = result.replace(/string\.Format\(\s*"([^"]+)"\s*,\s*([^)]+)\)/g, (match, str, args) => {
                    const argList = args.split(',').map(a => a.trim());
                    let interpolatedStr = str;

                    argList.forEach((arg, index) => {
                        const regExp = new RegExp(`\\{${index}\\}`, 'g');
                        interpolatedStr = interpolatedStr.replace(regExp, `{${arg}}`);
                    });

                    return `$"${interpolatedStr}"`;
                });

                // 3. Bloque namespace -> File-scoped namespace
                if (/^namespace\s+([A-Za-z0-9_.]+)\s*\{/m.test(result)) {
                    result = result.replace(/^namespace\s+([A-Za-z0-9_.]+)\s*\{/m, 'namespace $1;\n');
                    // Quita el último '}' del archivo
                    const lastBrace = result.lastIndexOf('}');
                    if (lastBrace !== -1) {
                        result = result.substring(0, lastBrace) + result.substring(lastBrace + 1);
                    }
                }

                return result.trim();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const adapter = new CSharpLabAdapter();
            const inputEl = document.getElementById('inputCode');
            const outputEl = document.getElementById('outputCode');
            const selectEl = document.getElementById('modeSelect');
            const btn = document.getElementById('btnConvert');

            // Ejemplo inicial
            inputEl.value =
                `namespace MiProyecto;

public class Estudiante(string nombre, int edad)
{
    public void Mostrar()
    {
        var notas = [];
        var mensaje = $"Hola {nombre}, tu edad es {edad}";
    }
}`;

            btn.addEventListener('click', () => {
                if (selectEl.value === 'toLegacy') {
                    outputEl.value = adapter.toLegacy(inputEl.value);
                } else {
                    outputEl.value = adapter.toModern(inputEl.value);
                }
            });
        });
    </script>
</body>

</html>
