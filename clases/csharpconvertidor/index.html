<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptador C# - Laboratorio (VS2012 / VS2026)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            padding: 20px;
            margin: 0;
        }

        h2 {
            color: #0066cc;
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666666;
            margin-top: 0;
            font-size: 14px;
        }

        .container {
            display: flex;
            gap: 20px;
            height: 68vh;
            margin-top: 20px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        textarea {
            flex: 1;
            background-color: #141414;
            color: #f8f8f2;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            outline: none;
        }

        textarea:focus {
            border-color: #10B981;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        select,
        button {
            background-color: #ffffff;
            color: #1a1a1a;
            border: 1px solid #cccccc;
            padding: 10px 16px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        button {
            background-color: #0066cc;
            color: #ffffff;
            border: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0052a3;
        }

        .info-box {
            max-width: 1000px;
            margin: 15px auto;
            padding: 12px 15px;
            background: #f4f4f5;
            border-left: 4px solid #0066cc;
            border-radius: 4px;
            font-size: 13px;
            color: #333333;
        }
    </style>
</head>

<body>

    <h2>Adaptador C# para Laboratorio</h2>
    <p class="subtitle">Puente Bidireccional Simétrico entre VS 2012 (C# 5) y VS 2022/2026 (C# 10–13)</p>

    <div class="container">
        <div class="panel">
            <label for="inputCode">Código de Entrada:</label>
            <textarea id="inputCode" placeholder="Pega el código aquí..."></textarea>
        </div>

        <div class="panel">
            <label for="outputCode">Código Convertido:</label>
            <textarea id="outputCode" readonly placeholder="El resultado compatible aparecerá aquí..."></textarea>
        </div>
    </div>

    <div class="controls">
        <label for="modeSelect" style="color:#1a1a1a; margin:0;">Modo de conversión:</label>
        <select id="modeSelect">
            <option value="toLegacy"> Moderno (2022/2026) ➔ Legacy (VS 2012)</option>
            <option value="toModern"> Legacy (VS 2012) ➔ Moderno (2022/2026)</option>
        </select>
        <button id="btnConvert">Procesar Código</button>
    </div>

    <div class="info-box">
        <strong>💡 Conversión Bidireccional:</strong> Ahora puedes convertir de Moderno a Legacy y viceversa sin pérdida
        de estructura ni llaves mal cerradas.
    </div>

    <script>
        class CSharpLabAdapter {

            // --- DE MODERNO A LEGACY (VS 2012 / C# 5) ---
            toLegacy(code) {
                if (!code) return '';
                let result = code;

                // 1. Convertir File-scoped namespace a Namespace de bloque
                result = result.replace(/^namespace\s+([A-Za-z0-9_.]+);/m, 'namespace $1\n{');

                // Asegurar llave de cierre del namespace
                if (!result.trim().endsWith('}')) {
                    result += '\n}';
                }

                // 2. Convertir Primary Constructors a tradicionales
                // Buscar: class Nombre(parametros) { ... }
                const primaryCtorRegex = /(public|private|internal|protected)?\s*class\s+([A-Za-z0-9_]+)\s*\(([^)]*)\)\s*\{/g;
                let match;
                let converted = result;

                while ((match = primaryCtorRegex.exec(result)) !== null) {
                    const fullMatch = match[0];
                    const access = match[1] || '';
                    const className = match[2];
                    const params = match[3].trim();

                    if (params) {
                        const paramList = params.split(',').map(p => p.trim()).filter(p => p);
                        let fields = '';
                        let assignments = '';
                        let ctorParams = [];

                        paramList.forEach((p) => {
                            const parts = p.split(/\s+/);
                            if (parts.length >= 2) {
                                const type = parts.slice(0, -1).join(' ');
                                const name = parts[parts.length - 1];
                                const propName = name.charAt(0).toUpperCase() + name.slice(1);

                                fields += `        public ${type} ${propName} { get; private set; }\n`;
                                assignments += `            this.${propName} = ${name};\n`;
                                ctorParams.push(p);
                            }
                        });

                        const newClassDecl = `${access}class ${className}\n    {\n${fields}\n        public ${className}(${ctorParams.join(', ')})\n        {\n${assignments}        }`;
                        converted = converted.replace(fullMatch, newClassDecl);
                    }
                }
                result = converted;

                // 3. Convertir [] a new List<string>()
                result = result.replace(/=\s*\[\];/g, '= new List<string>();');
                result = result.replace(/=\s*\[\]/g, '= new List<string>()');

                // 4. Convertir interpolación a string.Format
                result = result.replace(/\$"([^"\r\n]*?)"/g, (match, content) => {
                    let index = 0;
                    const vars = [];
                    const formatted = content.replace(/\{([^{}]+)\}/g, (m, expr) => {
                        vars.push(expr.trim());
                        return `{${index++}}`;
                    });
                    return vars.length > 0 ? `string.Format("${formatted}", ${vars.join(', ')})` : `"${content}"`;
                });

                return result;
            }

            // --- DE LEGACY (VS 2012 / C# 5) A MODERNO ---
            toModern(code) {
                if (!code) return '';
                let result = code;

                // 1. Convertir namespace con llaves a file-scoped
                const namespaceMatch = result.match(/^namespace\s+([A-Za-z0-9_.]+)\s*\{/m);
                if (namespaceMatch) {
                    result = result.replace(/^namespace\s+([A-Za-z0-9_.]+)\s*\{/m, 'namespace $1;');
                    // Eliminar la llave de cierre del namespace
                    const lines = result.split('\n');
                    if (lines[lines.length - 1].trim() === '}') {
                        lines.pop();
                        result = lines.join('\n');
                    }
                }

                // 2. Buscar constructores tradicionales y convertirlos a Primary Constructors
                const classMatch = result.match(/(public|private|internal|protected)?\s*class\s+([A-Za-z0-9_]+)\s*\{/);
                if (classMatch) {
                    const className = classMatch[2];

                    // Buscar el constructor
                    const ctorRegex = new RegExp(
                        `public\\s+${className}\\s*\\(([^)]*)\\)\\s*\\{[\\s\\S]*?\\}`,
                        'g'
                    );
                    const ctorMatch = ctorRegex.exec(result);

                    if (ctorMatch) {
                        const params = ctorMatch[1].trim();
                        if (params) {
                            // Verificar que el constructor asigna propiedades
                            const hasAssignments = /this\.[A-Za-z0-9_]+\s*=\s*[A-Za-z0-9_]+;/.test(ctorMatch[0]);
                            if (hasAssignments) {
                                // Eliminar campos y constructor
                                result = result.replace(/public\s+[A-Za-z0-9_.]+\s+[A-Za-z0-9_]+\s*\{\s*get;\s*private\s+set;\s*\}/g, '');
                                result = result.replace(ctorRegex, '');

                                // Actualizar declaración de clase
                                result = result.replace(
                                    /(public|private|internal|protected)?\s*class\s+([A-Za-z0-9_]+)\s*\{/,
                                    `$1 class $2(${params})\n{`
                                );
                            }
                        }
                    }
                }

                // 3. Convertir new List<T>() a []
                result = result.replace(/new\s+List<[^>]+>\s*\(\s*\)/g, '[]');

                // 4. Convertir string.Format a interpolación
                result = result.replace(
                    /string\.Format\(\s*"([^"]+)"\s*,\s*([^)]+)\)/g,
                    (match, format, args) => {
                        const argList = args.split(',').map(a => a.trim());
                        let interpolated = format;
                        argList.forEach((arg, index) => {
                            interpolated = interpolated.replace(
                                new RegExp(`\\{${index}\\}`, 'g'),
                                `{${arg}}`
                            );
                        });
                        return `$"${interpolated}"`;
                    }
                );

                // 5. Limpiar espacios
                result = result.replace(/\n\s*\n\s*\n/g, '\n\n');
                result = result.trim();

                return result;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const adapter = new CSharpLabAdapter();
            const inputEl = document.getElementById('inputCode');
            const outputEl = document.getElementById('outputCode');
            const selectEl = document.getElementById('modeSelect');
            const btn = document.getElementById('btnConvert');

            // Código de ejemplo mejorado
            inputEl.value = `namespace MiProyecto;

public class Estudiante(string nombre, int edad)
{
    public void Mostrar()
    {
        var notas = [];
        var mensaje = $"Hola {nombre}, tu edad es {edad}";
        Console.WriteLine(mensaje);
    }
}`;

            btn.addEventListener('click', () => {
                try {
                    if (selectEl.value === 'toLegacy') {
                        outputEl.value = adapter.toLegacy(inputEl.value);
                    } else {
                        outputEl.value = adapter.toModern(inputEl.value);
                    }
                } catch (error) {
                    outputEl.value = '❌ Error en la conversión: ' + error.message;
                }
            });

            // Auto-convertir al cambiar el modo
            selectEl.addEventListener('change', () => {
                btn.click();
            });

            // Ejecutar conversión inicial
            setTimeout(() => btn.click(), 100);
        });
    </script>
</body>

</html>
