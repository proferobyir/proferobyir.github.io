<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba WebAR con Diagnóstico</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
        }

        .container {
            width: 100vw;
            height: 70vh;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .ar-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }

        #status {
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            background: #333;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h2>Prueba de WebAR</h2>

    <div class="container">
        <model-viewer id="viewer" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" alt="Astronauta 3D"
            ar ar-modes="scene-viewer webxr quick-look" camera-controls auto-rotate>

            <button slot="ar-button" class="ar-button">
                📷 Ver en tu espacio
            </button>

        </model-viewer>
    </div>

    <div id="status">Verificando compatibilidad de AR...</div>

    <script>
        const viewer = document.getElementById('viewer');
        const status = document.getElementById('status');

        viewer.addEventListener('load', () => {
            if (viewer.canActivateAR) {
                status.innerHTML = "✅ **Tu teléfono soporta AR.** Presiona el botón verde.";
                status.style.color = "#85e085";
            } else {
                status.innerHTML = "❌ **Este dispositivo / navegador NO soporta AR sin marcador.**<br>Verifica tener 'Servicios de Google para RA' instalados y usar Chrome.";
                status.style.color = "#ff6666";
            }
        });
    </script>

</body>

</html>
