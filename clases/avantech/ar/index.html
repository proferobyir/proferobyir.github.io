<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Realidad Aumentada en Android</title>

    <!-- 1. A-Frame (Versión compatible) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.2.0/aframe.min.js"></script>

    <!-- 2. AR.js para A-Frame (Habilita la cámara del teléfono) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">

    <!-- Escena configurada para usar la cámara web/móvil con AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

        <!-- Marcador HIRO: Los objetos 3D aparecerán justo sobre esta marca -->
        <a-marker preset="hiro">

            <!-- Cubo giratorio -->
            <a-box position="-0.5 0.5 0" scale="0.5 0.5 0.5" color="#E94560"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>

            <!-- Esfera -->
            <a-sphere position="0.5 0.5 0" radius="0.3" color="#0F3460"></a-sphere>

            <!-- Cilindro -->
            <a-cylinder position="0 0.5 -0.5" radius="0.2" height="0.6" color="#533E85"></a-cylinder>

        </a-marker>

        <!-- Cámara de la escena (apunta a la cámara real del teléfono) -->
        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
