<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR con Cámara Directa (AR.js)</title>
    <!-- Librería A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Librería AR.js para A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- La escena accede directamente a la webcam del teléfono -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marcador tipo Hiro (puedes apuntar la cámara a la imagen del marcador Hiro) -->
        <a-marker preset="hiro">
            <!-- Un cubo 3D simple flotando sobre el marcador -->
            <a-box position="0 0.5 0" material="color: red;"></a-box>
        </a-marker>

        <!-- Cámara de la escena -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
