<!DOCTYPE html>
<html>

<head>
    <title>Mi Primera App WebAR</title>
    <!-- Librería A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Librería AR.js para A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

    <!-- Escena AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- Marcador Hiro Predeterminado -->
        <a-marker preset="hiro">
            <!-- Caja 3D Roja animada -->
            <a-box position="0 0.5 0" material="color: #e74c3c;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>

        <!-- Cámara AR -->
        <a-entity camera></a-entity>
    </a-scene>

</body>

</html>
