<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Modo Nativo Android</title>
    <!-- Importamos model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            height: 70vh;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .ar-button {
            background-color: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #error-msg {
            margin-top: 20px;
            color: #ffcc00;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- CRÍTICO: ar-modes="scene-viewer..." forzamos el uso de la app nativa de Android -->
        <model-viewer 
            id="viewer" 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            alt="Astronauta" 
            ar 
            ar-modes="scene-viewer webxr quick-look" 
            camera-controls 
            auto-rotate>
            
            <button slot="ar-button" class="ar-button">
                Ver en Realidad Aumentada
            </button>
            
        </model-viewer>
    </div>

    <div id="error-msg"></div>

    <script>
        const viewer = document.getElementById('viewer');
        const errorDiv = document.getElementById('error-msg');

        // Escucha si hay error al intentar abrir AR
        viewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'failed') {
                errorDiv.innerHTML = "No se pudo abrir la cámara. Asegúrate de tener 'Servicios de Google para RA' instalados.";
            }
        });
    </script>

</body>
</html>
