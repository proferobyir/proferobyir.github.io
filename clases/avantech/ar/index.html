<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio WebAR - Marcador Hiro</title>
    <!-- Librerías necesarias -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

    <!-- Escena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Aquí definimos el marcador Hiro -->
        <a-marker preset="hiro">
            
            <!-- MODELO 3D: Aquí cargamos el zapato -->
            <!-- scale: ajusta el tamaño (si se ve gigante, baja los números a 0.5) -->
            <!-- position: mueve el objeto sobre el marcador -->
            <a-entity 
                gltf-model="https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb"
                scale="2 2 2"
                position="0 0 0"
                rotation="0 0 0">
            </a-entity>

        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
