<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR - Prueba de Detección</title>

    <!-- Librerías estables vía CDN oficial -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">

    <!-- Agregamos detectionMode y matrixCodeType para mejor reconocimiento -->
    <a-scene embedded
        arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false">

        <!-- Marcador HIRO -->
        <a-marker preset="hiro">
            <!-- Objeto 3D más grande (1x1x1 metro) y elevado para asegurarse de que se vea -->
            <a-box position="0 0.5 0" material="color: red; opacity: 0.8;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        </a-marker>

        <!-- Cámara AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
