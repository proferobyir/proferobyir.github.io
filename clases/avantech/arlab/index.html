<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Librerías de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* Ajuste para evitar el zoom estirado en celulares */
        #arjs-video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- Escena AR con acceso directo a la cámara -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marcador "Hiro" -->
        <a-marker preset="hiro" smooth="true" smoothCount="5">
            
            <!-- Modelo 3D .glb del zapato -->
            <a-entity 
                gltf-model="https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb"
                scale="1.5 1.5 1.5"
                position="0 0 0"
                rotation="0 0 0">
            </a-entity>

        </a-marker>

        <!-- Cámara de la escena -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
