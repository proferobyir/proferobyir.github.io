<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# 5 Web IDE - Visual Studio 2012 Simulator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cargar Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>

<body>
    <!-- Barra superior estilo VS 2012 -->
    <header class="vs-header">
        <div class="vs-title">Visual Studio 2012 (C# 5 Simulator) - Program.cs</div>
        <div class="vs-toolbar">
            <button id="run-btn" class="vs-btn">▶ Compilar y Ejecutar (F5)</button>
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="vs-main">
        <!-- Editor de Código -->
        <div id="editor-container"></div>

        <!-- Consola de Salida / Resultados -->
        <div class="vs-console-panel">
            <div class="console-header">Consola de Salida (Output)</div>
            <pre id="console-output">Listo para compilar código C# 5...</pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
