<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Wlabel Code C# 5 - Simulador de Visual Studio 2012" />
    <meta property="og:description"
        content="Compila y ejecuta código C# 5 desde tu navegador. Práctica colecciones, LINQ y POO." />
    <meta property="og:image" content="https://proferobyir.github.io/pictures/wlabelsimulatorcodelogo.jpg" />
    <meta property="og:url" content="https://proferobyir.github.io" />
    <title>Wlabel Code C# 5 - Simulador VS 2012</title>

    <!-- ESTILO DE MONACO (Faltaba en tu código original) -->
    <link rel="stylesheet" data-name="vs/editor/editor.main"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.css">

    <link rel="stylesheet" href="style.css">
    <!-- Cargar Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>

<body>
    <header class="vs-header">
        <div class="vs-title">Visual Studio 2012 (C# 5 Simulator) - Program.cs</div>
        <div class="vs-toolbar">
            <button id="run-btn" class="vs-btn">▶ Compilar y Ejecutar (F5)</button>
        </div>
    </header>

    <div class="vs-main">
        <div id="editor-container"></div>

        <div class="vs-console-panel">
            <div class="console-header">Consola de Salida (Output)</div>
            <pre id="console-output">Listo para compilar código C# 5...</pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
