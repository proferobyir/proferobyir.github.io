<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code Mobile - Editor Web para Estudiantes sin computadora en casa</title>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.css">
    <!-- JSZip para exportar proyecto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra superior estilo VS Code */
        header {
            background-color: #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #3c3c3c;
            font-size: 13px;
        }

        .file-tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }

        .tab {
            background-color: #2d2d2d;
            color: #858585;
            padding: 6px 12px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .tab.active {
            background-color: #1e1e1e;
            color: #ffffff;
            border-color: #3c3c3c;
            border-bottom: 1px solid #1e1e1e;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        button:hover {
            background-color: #1177bb;
        }

        button.secondary {
            background-color: #3c3c3c;
        }

        button.secondary:hover {
            background-color: #505050;
        }

        /* Contenedor principal */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .editor-pane {
            flex: 1;
            display: none;
            position: relative;
        }

        .editor-pane.active {
            display: flex;
            flex-direction: column;
        }

        /* CodeMirror sizing */
        .CodeMirror {
            flex: 1;
            height: auto !important;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            background-color: #1e1e1e !important;
            color: #d4d4d4 !important;
        }

        .CodeMirror-gutters {
            background-color: #1e1e1e !important;
            border-right: 1px solid #333 !important;
            color: #858585 !important;
        }

        /* Vista Previa */
        #preview-pane {
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Consola móvil integrada */
        .console-box {
            height: 100px;
            background-color: #181818;
            border-top: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
            font-family: monospace;
            font-size: 12px;
        }

        .console-header {
            background-color: #252526;
            padding: 4px 8px;
            font-weight: bold;
            color: #bbbbbb;
            display: flex;
            justify-content: space-between;
        }

        .console-logs {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
            color: #4ec9b0;
        }

        .console-error {
            color: #f44747;
        }

        /* Teclado de atajos rápidos para celulares */
        .mobile-toolbar {
            background-color: #2d2d2d;
            display: flex;
            gap: 4px;
            padding: 6px;
            overflow-x: auto;
            border-top: 1px solid #3c3c3c;
        }

        .mobile-toolbar button {
            background: #333;
            color: #ccc;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 3px;
            min-width: 32px;
        }

        .mobile-toolbar button:active {
            background: #0e639c;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <div class="file-tabs">
            <div class="tab active" onclick="switchTab('html')">index.html</div>
            <div class="tab" onclick="switchTab('css')">styles.css</div>
            <div class="tab" onclick="switchTab('js')">script.js</div>
            <div class="tab" onclick="switchTab('preview')">👁️ Vista Previa</div>
        </div>
        <div class="actions">
            <button class="secondary" onclick="resetTemplate()">Restaurar</button>
            <button onclick="exportZip()">📦 Exportar ZIP</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Pestaña HTML -->
        <div id="pane-html" class="editor-pane active">
            <textarea id="code-html"></textarea>
        </div>
        <!-- Pestaña CSS -->
        <div id="pane-css" class="editor-pane">
            <textarea id="code-css"></textarea>
        </div>
        <!-- Pestaña JS -->
        <div id="pane-js" class="editor-pane">
            <textarea id="code-js"></textarea>
        </div>
        <!-- Pestaña Vista Previa -->
        <div id="pane-preview" class="editor-pane" style="flex-direction: column;">
            <iframe id="preview-frame"></iframe>
            <div class="console-box">
                <div class="console-header">
                    <span>Consola de Depuración</span>
                    <button class="secondary" style="padding: 1px 6px; font-size:10px;"
                        onclick="clearConsole()">Limpiar</button>
                </div>
                <div id="console-logs" class="console-logs"></div>
            </div>
        </div>
    </div>

    <!-- Barra de símbolos rápidos para teclado móvil -->
    <div class="mobile-toolbar">
        <button onclick="insertAtCursor('<')">&lt;</button>
        <button onclick="insertAtCursor('>')">&gt;</button>
        <button onclick="insertAtCursor('/')">/</button>
        <button onclick="insertAtCursor('=')">=</button>
        <button onclick="insertAtCursor('&quot;')">&quot;</button>
        <button onclick="insertAtCursor('#')">#</button>
        <button onclick="insertAtCursor('{')">{</button>
        <button onclick="insertAtCursor('}')">}</button>
        <button onclick="insertAtCursor(';')">;</button>
        <button onclick="insertAtCursor(':')">:</button>
        <button onclick="insertAtCursor('-')">-</button>
        <button onclick="triggerHint()">💡 Sugerencia</button>
    </div>

    <!-- CodeMirror JS y dependencias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.js"></script>

    <script>
        // Inicializar editores CodeMirror con autocompletado habilitado
        const editors = {
            html: CodeMirror.fromTextArea(document.getElementById('code-html'), {
                mode: 'htmlmixed', theme: 'dracula', lineNumbers: true, autoCloseTags: true, autoCloseBrackets: true
            }),
            css: CodeMirror.fromTextArea(document.getElementById('code-css'), {
                mode: 'css', theme: 'dracula', lineNumbers: true, autoCloseBrackets: true
            }),
            js: CodeMirror.fromTextArea(document.getElementById('code-js'), {
                mode: 'javascript', theme: 'dracula', lineNumbers: true, autoCloseBrackets: true
            })
        };

        // Plantilla base inicial limpia
        const defaultTemplates = {
            html: `<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Mi Tarea</title>\n    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n    <h1>¡Hola Mundo desde el Celular!</h1>\n    <p><a href=\"#seccion2\">Ir a la sección 2</a></p>\n    \n    <div id=\"seccion2\" style=\"margin-top: 200px;\">\n        <h2>Sección Destino del Enlace Ancla</h2>\n        <button onclick=\"saludar()\">Probar JS</button>\n    </div>\n\n    <script src=\"script.js\"><\/script>\n</body>\n</html>`,
            css: `body {\n    font-family: Arial, sans-serif;\n    padding: 20px;\n    background-color: #f4f4f4;\n}\nh1 {\n    color: #0066cc;\n}`,
            js: `function saludar() {\n    console.log(\"¡JavaScript funcionando perfectamente!\");\n    alert(\"¡Hola desde la tarea del celular!\");\n}`
        };

        // Cargar desde localStorage o usar plantilla por defecto
        function loadContent() {
            editors.html.setValue(localStorage.getItem('vs_html') || defaultTemplates.html);
            editors.css.setValue(localStorage.getItem('vs_css') || defaultTemplates.css);
            editors.js.setValue(localStorage.getItem('vs_js') || defaultTemplates.js);
        }

        // Guardar automáticamente cambios en localStorage
        Object.keys(editors).forEach(key => {
            editors[key].on('change', () => {
                localStorage.setItem('vs_' + key, editors[key].getValue());
                if (document.getElementById('pane-preview').classList.contains('active')) {
                    updatePreview();
                }
            });
        });

        loadContent();

        // Cambio de pestañas
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.editor-pane').forEach(p => p.classList.remove('active'));

            if (tabName === 'preview') {
                document.querySelectorAll('.tab')[3].classList.add('active');
                document.getElementById('pane-preview').classList.add('active');
                updatePreview();
            } else {
                const tabs = { html: 0, css: 1, js: 2 };
                document.querySelectorAll('.tab')[tabs[tabName]].classList.add('active');
                document.getElementById('pane-' + tabName).classList.add('active');
                editors[tabName].refresh();
            }
        }

        // Renderizar vista previa integrada con enlaces ancla suaves y captura de consola
        function updatePreview() {
            const html = editors.html.getValue();
            const css = editors.css.getValue();
            const js = editors.js.getValue();

            const combinedContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>${css}</style>
                </head>
                <body>
                    ${html.replace(/<link[^>]*rel=["']stylesheet["'][^>]*>/gi, '')}
                    <script>
                        // Redirigir console.log a la interfaz principal del celular
                        const originalLog = console.log;
                        const originalError = console.error;
                        console.log = function(...args) {
                            originalLog.apply(console, args);
                            window.parent.postMessage({type: 'log', message: args.join(' ')}, '*');
                        };
                        console.error = function(...args) {
                            originalError.apply(console, args);
                            window.parent.postMessage({type: 'error', message: args.join(' ')}, '*');
                        };
                        window.onerror = function(msg, url, line) {
                            window.parent.postMessage({type: 'error', message: 'Error: ' + msg + ' (Línea ' + line + ')'}, '*');
                        };
                    <\/script>
                    <script>${js}<\/script>
                    <script>
                        // Interceptar enlaces ancla para scroll suave dentro del iframe
                        document.addEventListener('click', function(e) {
                            const target = e.target.closest('a');
                            if (target && target.getAttribute('href') && target.getAttribute('href').startsWith('#')) {
                                e.preventDefault();
                                const id = target.getAttribute('href').substring(1);
                                const el = document.getElementById(id);
                                if (el) {
                                    el.scrollIntoView({ behavior: 'smooth' });
                                }
                            }
                        });
                    <\/script>
                </body>
                </html>
            `;

            const frame = document.getElementById('preview-frame');
            frame.srcdoc = combinedContent;
        }

        // Escuchar mensajes de consola del iframe
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type) {
                const logsBox = document.getElementById('console-logs');
                const div = document.createElement('div');
                div.textContent = `> ${e.data.message}`;
                if (e.data.type === 'error') div.className = 'console-error';
                logsBox.appendChild(div);
                logsBox.scrollTop = logsBox.scrollHeight;
            }
        });

        function clearConsole() {
            document.getElementById('console-logs').innerHTML = '';
        }

        // Inserción rápida de símbolos desde la barra móvil
        function insertAtCursor(symbol) {
            const activeTab = document.querySelector('.editor-pane.active');
            if (!activeTab || activeTab.id === 'pane-preview') return;
            const type = activeTab.id.replace('pane-', '');
            const editor = editors[type];
            const doc = editor.getDoc();
            const cursor = doc.getCursor();
            doc.replaceRange(symbol, cursor);
            editor.focus();
        }

        function triggerHint() {
            const activeTab = document.querySelector('.editor-pane.active');
            if (activeTab && activeTab.id !== 'pane-preview') {
                const type = activeTab.id.replace('pane-', '');
                editors[type].showHint({ completeSingle: false });
            }
        }

        function resetTemplate() {
            if (confirm("¿Estás seguro de restablecer el código por defecto?")) {
                localStorage.clear();
                loadContent();
                alert("Plantilla restaurada.");
            }
        }

        // Exportar ZIP en formato UTF-8 estricto
        function exportZip() {
            const zip = new JSZip();
            zip.file("index.html", editors.html.getValue(), { binary: false });
            zip.file("styles.css", editors.css.getValue(), { binary: false });
            zip.file("script.js", editors.js.getValue(), { binary: false });

            zip.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/zip;charset=utf-8" }).then(function (content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "mi_tarea_vscode.zip";
                link.click();
            });
        }
    </script>
</body>

</html>
